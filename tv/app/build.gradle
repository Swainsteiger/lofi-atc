plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anime.lofiatc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anime.lofiatc'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ExoPlayer: starts LiveATC's low-bitrate streams in a second or two and lets us read the audio for the talk light.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
}
