<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lofi ATC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #0b1020; --bg2: #1a1433; --text: #e9e6f5; --dim: #9a96b4; --accent: #ffb86b; --live: #5cf2a5;
  --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 120%, #3a2350 0%, var(--bg2) 35%, var(--bg1) 75%);
  color: var(--text); font-family: "Space Mono", ui-monospace, monospace; overflow: hidden;
}
#stars { position: fixed; inset: 0; z-index: 0; }
main { position: relative; z-index: 1; height: 100%; display: grid; place-items: center; padding: 16px; }
.panel { width: min(560px, 100%); text-align: center; }
.icao { font-size: clamp(64px, 18vw, 140px); font-weight: 700; letter-spacing: .08em; line-height: 1; margin: 0; }
.where { color: var(--dim); margin: 8px 0 4px; }
.clock { color: var(--accent); font-size: 20px; margin-bottom: 28px; }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; min-height: 20px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #555; transition: background .15s, box-shadow .15s; }
.dot.on { background: var(--live); box-shadow: 0 0 12px var(--live); }
.controls { margin-top: 26px; display: grid; gap: 14px; text-align: left; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 18px; backdrop-filter: blur(6px); }
.row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; }
label { color: var(--dim); font-size: 13px; }
select, input[type=range] { width: 100%; }
select { background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px; font: inherit; font-size: 13px; }
input[type=range] { accent-color: var(--accent); }
.play { margin-top: 22px; width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: #1a1433; font-size: 30px; display: inline-grid; place-items: center; }
.play:focus-visible, select:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.keys { margin-top: 18px; color: var(--dim); font-size: 11px; opacity: .7; }
.credit { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--dim); opacity: .6; z-index: 1; }
.credit a { color: inherit; }
.version { position: fixed; bottom: 8px; right: 12px; z-index: 2; background: none; border: 0; color: var(--dim);
  font: inherit; font-size: 11px; opacity: .7; cursor: pointer; padding: 2px 4px; }
.version:hover { opacity: 1; color: var(--text); }
.diag { position: fixed; right: 12px; bottom: 32px; z-index: 3; width: min(460px, calc(100% - 24px));
  background: rgba(11,16,32,.96); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.diag pre { margin: 0 0 8px; white-space: pre-wrap; font: inherit; font-size: 12px; line-height: 1.6; color: var(--text); }
.diag button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 3px 10px;
  font: inherit; font-size: 12px; cursor: pointer; }
.busy { margin-top: 10px; font-size: 13px; color: var(--dim); min-height: 18px; }
.busy button { margin-left: 8px; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px;
  padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.busy button:hover { background: rgba(255,184,107,.15); }
.track { display: none; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: -4px;
  padding-left: 84px; font-size: 12px; color: var(--dim); }
.track.on { display: grid; }
.track a { color: var(--text); text-decoration: none; }
.track a:hover { text-decoration: underline; }
.track .lic { opacity: .7; }
.track button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 3px 9px;
  font: inherit; cursor: pointer; }
.track button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
  <div class="panel">
    <h1 class="icao" id="icao">KLAS</h1>
    <div class="where" id="where"></div>
    <div class="clock" id="clock"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Press play</span></div>
    <div class="busy" id="busy"></div>
    <div class="controls">
      <div class="row"><label for="airport">Airport</label><select id="airport"></select></div>
      <div class="row"><label for="feed">Radio</label><select id="feed"></select></div>
      <div class="row"><label for="atcVol">ATC vol</label><input id="atcVol" type="range" min="0" max="100" value="80"></div>
      <div class="row"><label for="station">Music</label><select id="station"></select></div>
      <div class="track" id="track"><span id="trackInfo"></span>
        <span><button id="prev" aria-label="Previous track">⏮</button> <button id="next" aria-label="Next track">⏭</button></span></div>
      <div class="row"><label for="musicVol">Music vol</label><input id="musicVol" type="range" min="0" max="100" value="45"></div>
    </div>
    <button class="play" id="play" aria-label="Play">▶</button>
    <div class="keys">Space play/pause · ←/→ airport · ↑/↓ radio channel · M music · [ ] track · B busiest airport</div>
  </div>
</main>
<div class="credit">Made by <a href="https://github.com/Swainsteiger" target="_blank" rel="noopener">Swainsteiger</a> · ATC audio from <a href="https://www.liveatc.net" target="_blank" rel="noopener">LiveATC.net</a> (personal listening) · Soft lofi tracks under Creative Commons, <a href="https://github.com/Swainsteiger/lofi-atc/blob/main/MUSIC-CREDITS.md" target="_blank" rel="noopener">music credits</a> · inspired by lofiatc.com</div>
<button class="version" id="version" title="Version — tap for radio diagnostics"></button>
<div class="diag" id="diag" hidden><pre id="diagText"></pre><button id="diagCopy">Copy</button></div>
<script src="data.js"></script>
<script>
const STATIONS = window.STATIONS; // the Soft lofi playlist, then ad-free stations; see make_airports.py
const TRACKS = window.TRACKS || []; // Creative Commons tracks, see MUSIC-CREDITS.md
const A = window.AIRPORTS;
const $ = id => document.getElementById(id);
const VERSION = "1.1.3"; // shown on screen; build-windows.ps1 reads it for the installer
const atc = new Audio(), music = new Audio(), atcPlain = new Audio();
atc.preload = music.preload = atcPlain.preload = "none";
atc.crossOrigin = "anonymous"; // LiveATC allows it; lets the green dot follow the voices
// How the radio is doing, for the diagnostics panel. "stream" pulls it in quickly through the audio route that
// drives the talk light; "plain" is the backup: an ordinary player, slower to start, used when that fails.
const radio = { mode: "stream", http: 0, bytes: 0, error: "", fails: 0, why: "" };

function load() { try { return JSON.parse(localStorage.getItem("lofiatc") || "{}"); } catch (e) { return {}; } }
function save() {
  try { localStorage.setItem("lofiatc", JSON.stringify({ icao: cur().icao, feed: $("feed").value, station: $("station").value,
    atcVol: $("atcVol").value, musicVol: $("musicVol").value })); } catch (e) {}
}
const saved = load();
const want = (new URLSearchParams(location.search).get("icao") || saved.icao || "KLAS").toUpperCase();

A.forEach((a, i) => $("airport").add(new Option(`${a.icao} · ${a.city}`, i)));
STATIONS.forEach((s, i) => {
  let g = [...$("station").children].find(x => x.label === s.group);
  if (!g) { g = document.createElement("optgroup"); g.label = s.group; $("station").append(g); }
  g.append(new Option(s.name, i));
});
$("airport").value = Math.max(0, A.findIndex(a => a.icao === want));
$("station").value = saved.station < STATIONS.length ? saved.station : 0;
if (saved.atcVol) $("atcVol").value = saved.atcVol;
if (saved.musicVol) $("musicVol").value = saved.musicVol;

const cur = () => A[$("airport").value];
let playing = false;

function fillFeeds(keep) {
  const f = $("feed"); f.innerHTML = "";
  cur().feeds.forEach((x, i) => f.add(new Option(x.name, i)));
  if (keep != null && keep < cur().feeds.length) f.value = keep;
  const a = cur();
  $("icao").textContent = a.icao;
  $("where").textContent = `${a.name} · ${a.city}`;
  history.replaceState(null, "", "?icao=" + a.icao.toLowerCase());
  tick();
}
function tick() {
  const tz = cur().tz;
  try {
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", timeZone: tz || undefined })
      + (tz ? " local" : "");
  } catch (e) { $("clock").textContent = ""; }
}

// Live streams drop now and then: start them again after a short wait.
function start(el, url) {
  if (el._abort) el._abort.abort();
  if (el === atc && window.MediaSource && MediaSource.isTypeSupported("audio/mpeg")) feed(el, url);
  else el.src = url;
  if (el === atc) { radio.started = Date.now(); radio.bytes = 0; radio.http = 0; }
  // Chrome may refuse sound before the first click; then wait for the play button.
  el.play().catch(e => { if (e.name === "NotAllowedError" && playing) { pause(); setStatus("Press play"); } });
}
// ATC feeds are 16 kbit/s, and a plain <audio> waits ~20 s to fill its buffer before it starts.
// Pulling the stream ourselves and handing it over chunk by chunk starts it in a second or two.
function feed(el, url) {
  const ms = new MediaSource(), ctl = new AbortController();
  el._abort = ctl;
  el.src = URL.createObjectURL(ms);
  ms.addEventListener("sourceopen", async () => {
    const sb = ms.addSourceBuffer("audio/mpeg"), queue = [];
    sb.mode = "sequence";
    const pump = () => {
      if (sb.updating || ms.readyState !== "open") return;
      const b = el.buffered;
      if (b.length && el.currentTime - b.start(0) > 60) { sb.remove(b.start(0), el.currentTime - 30); return; }
      if (queue.length) sb.appendBuffer(queue.shift());
    };
    sb.addEventListener("updateend", pump);
    try {
      const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
      radio.http = r.status;
      if (!r.ok) throw new Error(r.status);
      const rd = r.body.getReader();
      for (;;) {
        const { value, done } = await rd.read();
        if (done) break;
        offAir = 0;
        radio.bytes += value.length; radio.fails = 0;
        queue.push(value); pump();
        // Stay near live: if playback fell far behind (tab asleep), jump forward.
        const b = el.buffered;
        if (b.length && b.end(b.length - 1) - el.currentTime > 15) el.currentTime = b.end(b.length - 1) - 2;
      }
      throw new Error("ended");
    } catch (e) {
      if (ctl.signal.aborted) return;
      radio.error = e.message || String(e);
      if (e.message === "404") skipFeed();
      // Twice without a single byte (blocked by a firewall or antivirus, say): use the backup player.
      else if (++radio.fails >= 2 && !radio.bytes) usePlain("couldn't stream: " + radio.error);
      else retry(el, "atc");
    }
  }, { once: true });
}
// The radio, in whichever mode it's in.
function startRadio() {
  if (radio.mode === "plain") { atcPlain.src = feedUrl(); atcPlain.play().catch(() => {}); radio.started = Date.now(); }
  else start(atc, feedUrl());
}
function stopRadio() {
  if (atc._abort) atc._abort.abort();
  for (const el of [atc, atcPlain]) { el.pause(); el.removeAttribute("src"); }
}
function usePlain(why) {
  if (radio.mode === "plain") return;
  radio.mode = "plain"; radio.why = why;
  stopRadio();
  if (playing) { setStatus("Radio: switching to the backup player (starts in ~20 s)…"); startRadio(); }
}
atcPlain.addEventListener("playing", () => setStatus(`${cur().feeds[$("feed").value].name} · ${STATIONS[$("station").value].name}`));
atcPlain.addEventListener("error", () => { radio.error = "backup player error " + (atcPlain.error && atcPlain.error.code); retry(atcPlain, "atc"); });
atcPlain.addEventListener("ended", () => retry(atcPlain, "atc"));
// A channel LiveATC has taken off air answers 404: move on to the airport's next channel by itself.
let offAir = 0;
function skipFeed() {
  if (++offAir >= cur().feeds.length) { offAir = 0; retry(atc, "atc"); return; }
  const f = $("feed");
  f.value = (Number(f.value) + 1) % cur().feeds.length;
  save();
  setStatus("Channel off air, trying " + cur().feeds[f.value].name + "…");
  startRadio();
}
function retry(el, which) {
  if (!playing) return;
  setStatus(which === "atc" ? "Radio reconnecting…" : "Music reconnecting…");
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (playing) which === "atc" ? startRadio() : start(el, stationUrl()); }, 4000);
}
const feedUrl = () => cur().feeds[$("feed").value].url;

// The Soft lofi playlist: tracks in shuffled order, a fresh shuffle each time round.
let order = [], pos = 0, trackErrors = 0;
function shuffle() {
  order = TRACKS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0;
}
shuffle();
const isPlaylist = () => !!STATIONS[$("station").value].playlist;
const track = () => TRACKS[order[pos]];
// Testing before the tracks are uploaded: ?music=local plays them from music/build through serve.pyw.
const localMusic = new URLSearchParams(location.search).get("music") === "local";
const stationUrl = () => !isPlaylist() ? STATIONS[$("station").value].url
  : localMusic ? "/music/" + track().url.split("/").pop() : track().url;
function skip(d) {
  pos += d;
  if (pos >= order.length) shuffle(); else if (pos < 0) pos = order.length - 1;
  showTrack();
  if (playing && isPlaylist()) start(music, stationUrl());
}
function showTrack() {
  $("track").classList.toggle("on", isPlaylist());
  if (!isPlaylist() || !track()) return;
  const t = track(), info = $("trackInfo");
  info.textContent = "♪ ";
  const a = document.createElement("a");
  a.href = t.artistSite; a.target = "_blank"; a.rel = "noopener";
  a.textContent = `${t.title} — ${t.artist}`;
  const lic = document.createElement("a");
  lic.className = "lic"; lic.href = t.licenseUrl; lic.target = "_blank"; lic.rel = "noopener";
  lic.textContent = ` · ${t.license}`;
  info.append(a, lic);
}
$("prev").onclick = () => skip(-1);
$("next").onclick = () => skip(1);

[[atc, "atc"], [music, "music"]].forEach(([el, w]) => {
  el.addEventListener("error", () => {
    // A playlist track that fails to load is skipped; after a run of failures, wait a little first.
    if (el === music && isPlaylist() && playing) { setTimeout(() => skip(1), ++trackErrors > 3 ? 5000 : 500); return; }
    retry(el, w);
  });
  el.addEventListener("ended", () => el === music && isPlaylist() ? skip(1) : retry(el, w));
  el.addEventListener("playing", () => {
    if (el === music) trackErrors = 0;
    setStatus(playing ? `${cur().feeds[$("feed").value].name} · ${STATIONS[$("station").value].name}` : "");
  });
});
function setStatus(t) { $("status").textContent = t; }

function vol() { atc.volume = atcPlain.volume = $("atcVol").value / 100; music.volume = $("musicVol").value / 100; save(); }
function play() {
  playing = true; vol(); setStatus("Tuning in…");
  startRadio(); start(music, stationUrl());
  $("play").textContent = "❚❚"; $("play").setAttribute("aria-label", "Pause");
  meter();
}
function pause() {
  playing = false; stopRadio(); music.pause(); music.removeAttribute("src");
  $("play").textContent = "▶"; $("play").setAttribute("aria-label", "Play"); setStatus("Paused"); $("dot").classList.remove("on");
}
$("play").onclick = () => playing ? pause() : play();
$("airport").onchange = () => { offAir = 0; fillFeeds(); showBusy(); save(); if (playing) startRadio(); };
$("feed").onchange = () => { offAir = 0; save(); if (playing) startRadio(); };
$("station").onchange = () => { save(); showTrack(); if (playing) start(music, stationUrl()); };
$("atcVol").oninput = $("musicVol").oninput = vol;

// Any click or key also wakes a suspended radio route (browsers only allow it right after one).
for (const ev of ["pointerdown", "keydown"])
  addEventListener(ev, () => { if (ctx && ctx.state !== "running") ctx.resume().catch(() => {}); }, true);

addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" && !e.code.startsWith("Space")) return;
  const step = (id, d, n) => { const s = $(id); s.value = (Number(s.value) + d + n) % n; s.onchange(); };
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowRight") step("airport", 1, A.length);
  else if (e.key === "ArrowLeft") step("airport", -1, A.length);
  else if (e.key === "ArrowDown") { e.preventDefault(); step("feed", 1, cur().feeds.length); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step("feed", -1, cur().feeds.length); }
  else if (e.key.toLowerCase() === "m") step("station", 1, STATIONS.length);
  else if (e.key === "]" && isPlaylist()) skip(1);
  else if (e.key === "[" && isPlaylist()) skip(-1);
  else if (e.key.toLowerCase() === "b" && busiest()) { $("airport").value = A.indexOf(busiest()); $("airport").onchange(); }
});

// The green dot lights while a controller or pilot is talking. Needs the stream to allow reading its audio;
// if it does not, the dot simply stays lit while the radio plays.
let ctx, analyser, buf;
function meter() {
  // The radio plays through this audio route. A route made before the first click (the page trying to start
  // on its own) begins suspended, which silences the radio while the music plays: wake it on every play.
  if (ctx) { if (ctx.state !== "running") ctx.resume().catch(() => {}); return; }
  try {
    ctx = new AudioContext();
    analyser = ctx.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.fftSize);
    ctx.createMediaElementSource(atc).connect(analyser); analyser.connect(ctx.destination);
  } catch (e) { analyser = null; }
  (function loop() {
    let on;
    if (radio.mode === "plain") on = playing && !atcPlain.paused && atcPlain.readyState > 2; // lit while it plays
    else {
      on = playing && !atc.paused;
      if (on && analyser) {
        analyser.getByteTimeDomainData(buf);
        let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
        on = peak > 6;
      }
    }
    $("dot").classList.toggle("on", on);
    requestAnimationFrame(loop);
  })();
}
// Watchdog, on a timer (browsers pause animation loops in hidden windows): audio arriving but not being heard
// (the route won't wake, or the browser can't play the pieces) → the backup player.
setInterval(() => {
  if (radio.mode !== "stream" || !playing) return;
  const age = Date.now() - (radio.started || Date.now());
  if (age < 8000 || radio.bytes < 20000) return;
  if (ctx && ctx.state !== "running") usePlain("audio route stayed " + ctx.state);
  else if (atc.currentTime === 0) usePlain("stream arrived but didn't play");
}, 1000);

// ---- version and diagnostics: tap the version (bottom right) to see what the radio is doing ----
function browserName() {
  const ua = navigator.userAgent, m = ua.match(/Edg\/([\d.]+)/) ? ["Edge", ua.match(/Edg\/([\d]+)/)[1]]
    : ua.match(/Chrome\/([\d]+)/) ? ["Chrome", ua.match(/Chrome\/([\d]+)/)[1]]
    : ua.match(/Firefox\/([\d]+)/) ? ["Firefox", ua.match(/Firefox\/([\d]+)/)[1]] : ["browser", ""];
  return m.join(" ");
}
function diagText() {
  const el = radio.mode === "plain" ? atcPlain : atc;
  return [
    "Lofi ATC " + VERSION + " by Swainsteiger · " + browserName(),
    "Radio: " + cur().icao + " · " + cur().feeds[$("feed").value].name,
    "Mode: " + (radio.mode === "plain" ? "backup player (" + radio.why + ")" : "fast stream"),
    "LiveATC answer: " + (radio.http || "–") + " · received " + Math.round(radio.bytes / 1024) + " KB",
    "Player: " + (playing ? (el.paused ? "paused" : "playing") : "stopped") + " · at " + el.currentTime.toFixed(1)
      + " s · ready " + el.readyState + (el.error ? " · error " + el.error.code : ""),
    "Audio route: " + (radio.mode === "plain" ? "not used" : ctx ? ctx.state : "not set up")
      + " · talk light: " + ($("dot").classList.contains("on") ? "on" : "off"),
    "Last radio error: " + (radio.error || "none"),
    "Music: " + (music.paused ? "paused" : "playing") + " · at " + music.currentTime.toFixed(0) + " s",
  ].join("\n");
}
$("version").textContent = "v" + VERSION;
$("version").onclick = () => {
  const d = $("diag");
  d.hidden = !d.hidden;
  if (!d.hidden) (function show() { if (d.hidden) return; $("diagText").textContent = diagText(); setTimeout(show, 1000); })();
};
$("diagCopy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(diagText()).then(() => {
  $("diagCopy").textContent = "Copied"; setTimeout(() => $("diagCopy").textContent = "Copy", 1500); });

// Twinkling night sky with the odd plane crossing it.
const cv = $("stars"), g = cv.getContext("2d");
let stars = [], planes = [];
function size() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  stars = Array.from({ length: Math.round(innerWidth * innerHeight / 4000) }, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height * .85, r: Math.random() * 1.3 + .2, p: Math.random() * 6.3 }));
}
addEventListener("resize", size); size();
function draw(t) {
  g.clearRect(0, 0, cv.width, cv.height);
  for (const s of stars) {
    g.globalAlpha = .35 + .35 * Math.sin(t / 1400 + s.p);
    g.fillStyle = "#fff"; g.beginPath(); g.arc(s.x, s.y, s.r * devicePixelRatio, 0, 7); g.fill();
  }
  if (Math.random() < .002 && planes.length < 2)
    planes.push({ x: -20, y: cv.height * (.1 + Math.random() * .4), v: (.4 + Math.random() * .4) * devicePixelRatio, b: 0 });
  planes = planes.filter(p => p.x < cv.width + 20);
  for (const p of planes) {
    p.x += p.v; p.b++;
    g.globalAlpha = .9; g.fillStyle = "#fff"; g.fillRect(p.x, p.y, 2 * devicePixelRatio, 2 * devicePixelRatio);
    if (p.b % 70 < 6) { g.fillStyle = "#ff5c5c"; g.beginPath(); g.arc(p.x, p.y, 3 * devicePixelRatio, 0, 7); g.fill(); }
  }
  g.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// Planes around each airport right now, from the helper that serves this page (serve.pyw).
// Opened straight from disk there is no helper, and this stays hidden.
let counts = {}, helper = false;
async function activity() {
  try {
    const r = await fetch("/activity", { cache: "no-store" });
    counts = (await r.json()).counts || {};
    helper = true;
  } catch (e) { counts = {}; helper = false; }
  // Every few seconds until all airports are counted (about 30 s after the helper starts), then every minute.
  clearTimeout(activity.t);
  activity.t = setTimeout(activity, helper && Object.keys(counts).length < A.length ? 3000 : 60000);
  const top = busiest();
  A.forEach((a, i) => {
    const n = counts[a.icao];
    $("airport").options[i].text = `${a.icao} · ${a.city}` + (n != null ? `  ✈ ${n}` : "") + (top && a.icao === top.icao ? "  ★ busiest" : "");
  });
  showBusy();
}
function busiest() {
  let top = null;
  for (const a of A) if (counts[a.icao] != null && (!top || counts[a.icao] > counts[top.icao])) top = a;
  return top;
}
function showBusy() {
  const b = $("busy"), n = counts[cur().icao], top = busiest();
  b.textContent = n != null ? `✈ ${n} plane${n === 1 ? "" : "s"} around ${cur().icao} now`
    : helper ? "✈ counting planes…" : "";
  if (top && top !== cur()) {
    const go = document.createElement("button");
    go.textContent = `Busiest: ${top.icao} ✈ ${counts[top.icao]} →`;
    go.onclick = () => { $("airport").value = A.indexOf(top); $("airport").onchange(); };
    b.append(go);
  }
}
activity();

fillFeeds(saved.icao === want ? saved.feed : null);
showTrack();
setInterval(tick, 10000);
play();
</script>
